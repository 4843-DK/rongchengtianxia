<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>周荣 · 就医报告 · 荣城天下</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #e6e9ef;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px;
            min-height: 100vh;
            font-family: 'Microsoft YaHei', 'PingFang SC', Arial, sans-serif;
            transition: background 0.8s ease;
        }

        body.underworld {
            background: #0a0a0a;
        }

        body.underworld .report-container {
            background: #0f0f0f;
            border-color: #441111;
        }

        body.underworld .hospital-name,
        body.underworld .hospital-sub,
        body.underworld .report-title,
        body.underworld .info-grid .item,
        body.underworld .info-grid .item .value,
        body.underworld .section-title,
        body.underworld .section-body,
        body.underworld .signature-area .item,
        body.underworld .report-footer {
            color: #cc2222;
        }

        body.underworld .info-grid {
            background: #111111;
        }

        body.underworld .section-body {
            background: #111111;
            border-left-color: #882222;
        }

        body.underworld .signature-area {
            border-top-color: #441111;
        }

        body.underworld .report-footer {
            border-top-color: #441111;
        }

        body.underworld .global-search input {
            background: #1a1a1a;
            color: #cc2222;
            border-color: #441111;
        }

        body.underworld .global-search input::placeholder {
            color: #553333;
        }

        body.underworld .global-search button {
            background: #1a1a1a;
            color: #cc2222;
            border-color: #441111;
        }

        body.underworld .global-search button:hover {
            background: #2a0a0a;
        }

        body.underworld .mode-hint {
            color: #883333;
        }

        body.underworld .mode-hint .hidden-text {
            color: #883333;
            font-style: italic;
            text-decoration: line-through;
        }

        /* 红色墨块 */
        .redacted-red {
            display: inline-block;
            background: #882222;
            color: #882222;
            padding: 0 6px;
            border-radius: 2px;
            font-weight: normal;
            letter-spacing: 2px;
            user-select: none;
            min-width: 40px;
        }

        body.underworld .redacted-red {
            background: #661111;
            color: #661111;
        }

        .redacted-sm {
            min-width: 60px;
        }

        .redacted-md {
            min-width: 90px;
        }

        .redacted-lg {
            min-width: 120px;
        }

        .global-search {
            width: 100%;
            max-width: 820px;
            display: flex;
            justify-content: flex-end;
            gap: 6px;
            margin-bottom: 16px;
        }

        .global-search input {
            width: 200px;
            padding: 6px 12px;
            font-size: 13px;
            border: 1px solid #b0a898;
            background: #ffffff;
            color: #1a1a1a;
            outline: none;
            border-radius: 2px;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.8s ease, color 0.8s ease;
            font-family: inherit;
        }

        .global-search input:focus {
            border-color: #3a6a9a;
            box-shadow: 0 0 0 2px rgba(58, 106, 154, 0.15);
        }

        .global-search input::placeholder {
            color: #9a9a8a;
            font-size: 12px;
        }

        .global-search button {
            padding: 6px 16px;
            font-size: 13px;
            border: 1px solid #b0a898;
            background: #ffffff;
            color: #1a1a1a;
            cursor: pointer;
            border-radius: 2px;
            transition: background 0.2s, border-color 0.2s, background 0.8s ease, color 0.8s ease;
            font-family: inherit;
        }

        .global-search button:hover {
            background: #f0ece4;
            border-color: #8a8a7a;
        }

        .report-container {
            max-width: 820px;
            width: 100%;
            background: #ffffff;
            border: 1px solid #b0b8c4;
            padding: 32px 36px 28px 36px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            transition: background 0.8s ease, border-color 0.8s ease;
        }

        .mode-hint {
            text-align: center;
            font-size: 13px;
            color: #999;
            margin-bottom: 18px;
            transition: color 0.8s ease;
        }

        .hospital-name {
            font-size: 22px;
            font-weight: bold;
            color: #1a2a3a;
            text-align: center;
            letter-spacing: 2px;
            transition: color 0.8s ease;
        }

        .hospital-sub {
            font-size: 14px;
            color: #6a7a8a;
            text-align: center;
            letter-spacing: 2px;
            margin-top: 2px;
            transition: color 0.8s ease;
        }

        .report-title {
            font-size: 17px;
            font-weight: bold;
            text-align: center;
            color: #1a2a3a;
            margin: 16px 0 16px 0;
            letter-spacing: 2px;
            transition: color 0.8s ease;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 6px 16px;
            background: #f7f8fa;
            padding: 14px 20px;
            margin-bottom: 18px;
            transition: background 0.8s ease;
        }

        .info-grid .item {
            display: flex;
            gap: 4px;
            font-size: 14px;
            color: #1a2a3a;
            transition: color 0.8s ease;
        }

        .info-grid .item .label {
            color: #6a7a8a;
            min-width: 50px;
            transition: color 0.8s ease;
        }

        .info-grid .item .value {
            color: #1a2a3a;
            font-weight: 500;
            transition: color 0.8s ease;
        }

        .section-title {
            font-size: 15px;
            font-weight: bold;
            color: #1a2a3a;
            margin: 16px 0 8px 0;
            transition: color 0.8s ease;
        }

        .section-body {
            font-size: 14px;
            line-height: 1.9;
            color: #1a2a3a;
            padding: 10px 16px;
            background: #fafbfc;
            border-left: 3px solid #d0d8e0;
            transition: background 0.8s ease, border-color 0.8s ease, color 0.8s ease;
        }

        .signature-area {
            margin-top: 22px;
            padding-top: 14px;
            border-top: 2px solid #d0d8e0;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            font-size: 14px;
            color: #1a2a3a;
            transition: border-color 0.8s ease, color 0.8s ease;
        }

        .signature-area .item .label {
            color: #6a7a8a;
            transition: color 0.8s ease;
        }

        .signature-area .item .sign {
            font-family: 'KaiTi', '楷体', serif;
            font-size: 17px;
            letter-spacing: 3px;
            transition: color 0.8s ease;
        }

        .report-footer {
            margin-top: 16px;
            padding-top: 12px;
            border-top: 1px solid #e8ecf0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            font-size: 13px;
            color: #8a9aaa;
            transition: border-color 0.8s ease, color 0.8s ease;
        }

        .report-footer .back-link {
            color: #3a6a9a;
            text-decoration: none;
            font-size: 13px;
            border-bottom: 1px solid transparent;
            transition: border-color 0.2s, color 0.8s ease;
        }

        .report-footer .back-link:hover {
            border-bottom-color: #3a6a9a;
        }

        .flash-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #cc0000;
            z-index: 9999;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.01s ease;
        }

        .flash-overlay.active {
            opacity: 0.5;
            transition: opacity 0s ease;
        }

        @media (max-width: 640px) {
            .report-container {
                padding: 20px 16px 18px 16px;
            }

            .info-grid {
                grid-template-columns: 1fr 1fr;
                gap: 4px 12px;
            }

            .signature-area {
                flex-direction: column;
                gap: 6px;
            }

            .global-search input {
                width: 140px;
                font-size: 12px;
                padding: 4px 10px;
            }

            .global-search button {
                font-size: 12px;
                padding: 4px 12px;
            }

            .redacted-red {
                min-width: 30px;
                padding: 0 4px;
            }

            .redacted-sm {
                min-width: 40px;
            }

            .redacted-md {
                min-width: 60px;
            }

            .redacted-lg {
                min-width: 80px;
            }
        }
    </style>
</head>
<body>

    <div class="flash-overlay" id="flashOverlay"></div>

    <div class="global-search">
        <input type="text" id="searchInput" placeholder="在此处搜索" onkeydown="if(event.key==='Enter'){doSearch();}">
        <button onclick="doSearch()">搜索</button>
    </div>

    <div class="report-container" id="reportContainer">

        <div class="mode-hint" id="modeHint">你正在查看公开的就医记录</div>

        <div class="hospital-name">三江口市第一人民医院</div>
        <div class="hospital-sub">急诊科 · 门诊病历</div>

        <div class="report-title" id="reportTitle">急诊就诊记录</div>

        <div class="info-grid" id="infoGrid">
            <!-- 由 JavaScript 动态渲染 -->
        </div>

        <div class="section-title">诊断结果</div>
        <div class="section-body" id="diagnosisBody">
            <!-- 由 JavaScript 动态渲染 -->
        </div>

        <div class="section-title">处理意见</div>
        <div class="section-body" id="treatmentBody">
            <!-- 由 JavaScript 动态渲染 -->
        </div>

        <div class="signature-area" id="signatureArea">
            <!-- 由 JavaScript 动态渲染 -->
        </div>

        <div class="report-footer" id="reportFooter">
            <span id="footerNote">（本报告为阶段性总结，不作为最终结论。）</span>
            <a href="main.html" class="back-link">← 返回档案目录</a>
        </div>

    </div>

    <script>
        try {
            localStorage.setItem('zhourongMedicalUnlocked', 'true');
        } catch (e) {}

        var SECRET_KEY = '20080827';

        var data = {
            surface: {
                hint: '你正在查看公开的就医记录',
                title: '急诊就诊记录',
                info: [
                    { label: '病案号', value: 'M-2011-0803-01（表）' },
                    { label: '姓名', value: '周荣' },
                    { label: '性别', value: '男' },
                    { label: '年龄', value: '33岁' },
                    { label: '就诊日期', value: '2011-08-03' },
                    { label: '科室', value: '急诊科' }
                ],
                diagnosis: '左腕部割裂伤，失血性休克。经抢救后生命体征恢复，目前意识清醒，生命体征平稳。',
                treatment: '住院观察，建议转至上级医院进一步休养。避免长期高压工作状态，建议定期复查。',
                signature: [
                    { label: '主治医师', value: '王明远' },
                    { label: '科室主任', value: '刘志远' },
                    { label: '记录时间', value: '2011-08-04 09:30' }
                ],
                footer: '（本报告为阶段性总结，不作为最终结论。院方已将详细情况移交家属。）'
            },
            underworld: {
                hint: '[<span class="hidden-text">以下内容已被隐藏</span>]',
                title: '急诊就诊记录',
                info: [
                    { label: '病案号', value: '<span class="redacted-red redacted-md">M-2011-0803-02</span>' },
                    { label: '姓名', value: '周荣' },
                    { label: '性别', value: '男' },
                    { label: '年龄', value: '<span class="redacted-red redacted-sm">33岁</span>' },
                    { label: '就诊日期', value: '2011-08-03' },
                    { label: '科室', value: '急诊科' }
                ],
                diagnosis: '左腕部割裂伤，<span class="redacted-red redacted-lg">失血性休克</span>。经全力抢救无效，于 <span class="redacted-red redacted-md">2011-08-03 23:47</span> 宣告死亡。',
                treatment: '死亡原因：<span class="redacted-red redacted-lg">失血性休克</span>。遗体已移交家属处理后事。应家属要求，<span class="redacted-red redacted-md">死亡信息暂不对外公开</span>。',
                signature: [
                    { label: '主治医师', value: '<span class="redacted-red redacted-md">王明远</span>' },
                    { label: '科室主任', value: '<span class="redacted-red redacted-md">刘志远</span>' },
                    { label: '死亡确认时间', value: '<span class="redacted-red redacted-md">2011-08-03 23:47</span>' }
                ],
                footer: '（本报告为最终记录，已归档封存。未经授权不得查阅。）'
            }
        };

        var isUnderworld = false;
        var flashOverlay = document.getElementById('flashOverlay');

        function flashAndSwitch(targetUnderworld) {
            flashOverlay.classList.add('active');
            setTimeout(function() {
                isUnderworld = targetUnderworld;
                renderReport(isUnderworld);
            }, 50);
            setTimeout(function() {
                flashOverlay.classList.remove('active');
            }, 80);
        }

        function renderReport(underworld) {
            var d = underworld ? data.underworld : data.surface;
            var body = document.body;

            if (underworld) {
                body.classList.add('underworld');
            } else {
                body.classList.remove('underworld');
            }

            document.getElementById('modeHint').innerHTML = d.hint;
            document.getElementById('reportTitle').textContent = d.title;
            document.getElementById('footerNote').innerHTML = d.footer;

            var infoGrid = document.getElementById('infoGrid');
            var infoHtml = '';
            for (var i = 0; i < d.info.length; i++) {
                infoHtml += '<div class="item"><span class="label">' + d.info[i].label + '</span><span class="value">' + d.info[i].value + '</span></div>';
            }
            infoGrid.innerHTML = infoHtml;

            document.getElementById('diagnosisBody').innerHTML = d.diagnosis;
            document.getElementById('treatmentBody').innerHTML = d.treatment;

            var sigArea = document.getElementById('signatureArea');
            var sigHtml = '';
            for (var j = 0; j < d.signature.length; j++) {
                sigHtml += '<div class="item"><span class="label">' + d.signature[j].label + '</span><span class="sign">' + d.signature[j].value + '</span></div>';
            }
            sigArea.innerHTML = sigHtml;
        }

        function doSearch() {
            var keyword = document.getElementById('searchInput').value.trim();
            if (!keyword) return;

            if (keyword === SECRET_KEY) {
                flashAndSwitch(!isUnderworld);
                document.getElementById('searchInput').value = '';
                return;
            }

            window.location.href = 'search_result.html?keyword=' + encodeURIComponent(keyword);
        }

        renderReport(false);
        window.doSearch = doSearch;
    </script>

</body>
</html>
