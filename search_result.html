<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>搜索结果 · 荣城天下</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #e6e9ef;
            font-family: 'Microsoft YaHei', 'PingFang SC', '宋体', sans-serif;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .global-search {
            width: 100%;
            max-width: 780px;
            display: flex;
            justify-content: flex-end;
            gap: 6px;
            margin-bottom: 16px;
        }

        .global-search input {
            width: 200px;
            padding: 6px 12px;
            font-size: 13px;
            border: 1px solid #b0b8c4;
            background: #ffffff;
            color: #1a2a3a;
            outline: none;
            border-radius: 2px;
            transition: border-color 0.2s, box-shadow 0.2s;
            font-family: inherit;
        }

        .global-search input:focus {
            border-color: #3a6a9a;
            box-shadow: 0 0 0 2px rgba(58, 106, 154, 0.15);
        }

        .global-search input::placeholder {
            color: #9aa8b8;
            font-size: 12px;
        }

        .global-search button {
            padding: 6px 16px;
            font-size: 13px;
            border: 1px solid #b0b8c4;
            background: #ffffff;
            color: #1a2a3a;
            cursor: pointer;
            border-radius: 2px;
            transition: background 0.2s, border-color 0.2s;
            font-family: inherit;
        }

        .global-search button:hover {
            background: #f0f2f4;
            border-color: #8a9aaa;
        }

        .result-container {
            max-width: 780px;
            width: 100%;
            background: #ffffff;
            border-radius: 4px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            padding: 32px 36px 28px 36px;
        }

        .result-container .header {
            border-bottom: 2px solid #e0e4e8;
            padding-bottom: 12px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .result-container .header .title {
            font-size: 16px;
            font-weight: bold;
            color: #1a2a3a;
            letter-spacing: 1px;
        }

        .result-container .header .keyword-display {
            font-size: 14px;
            color: #3a6a9a;
            font-weight: normal;
            margin-left: 4px;
        }

        .result-count {
            font-size: 14px;
            color: #4a5a6a;
            margin-bottom: 16px;
        }

        .result-count strong {
            color: #1a2a3a;
            font-weight: bold;
        }

        .result-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .result-item {
            display: inline-block;
            padding: 4px 0;
            font-size: 15px;
            color: #1a6bb0;
            text-decoration: underline;
            cursor: pointer;
            transition: color 0.15s;
            border: none;
            background: none;
            width: fit-content;
        }

        .result-item:hover {
            color: #e65c00;
        }

        .result-item:visited {
            color: #6a3a9a;
        }

        .empty-result {
            text-align: center;
            padding: 40px 20px 32px 20px;
        }

        .empty-result .empty-text {
            font-size: 16px;
            color: #4a5a6a;
            line-height: 1.8;
        }

        .empty-result .empty-text .keyword-highlight {
            color: #3a6a9a;
            font-weight: bold;
        }

        .empty-result .empty-hint {
            font-size: 13px;
            color: #8a9aaa;
            margin-top: 8px;
        }

        .unlock-toast {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: #1a2a3a;
            color: #f0f0f0;
            padding: 10px 28px;
            border-radius: 4px;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.3s ease;
            pointer-events: none;
            z-index: 999;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.20);
            font-family: 'Microsoft YaHei', sans-serif;
        }

        .unlock-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        @media (max-width: 600px) {
            .global-search {
                justify-content: center;
            }
            .global-search input {
                width: 140px;
                font-size: 12px;
                padding: 4px 10px;
            }
            .global-search button {
                font-size: 12px;
                padding: 4px 12px;
            }
            .result-container {
                padding: 20px 16px 18px 16px;
            }
            .result-container .header {
                flex-wrap: wrap;
                gap: 4px;
            }
            .result-item {
                font-size: 14px;
            }
            .unlock-toast {
                bottom: 24px;
                padding: 8px 20px;
                font-size: 13px;
                max-width: 80%;
            }
        }
    </style>
</head>
<body>

    <div class="global-search">
        <input type="text" id="searchInput" placeholder="在此处搜索" autocomplete="on">
        <button onclick="doSearch()">搜索</button>
    </div>

    <div class="result-container" id="resultContainer"></div>

    <div class="unlock-toast" id="unlockToast">📂 档案已解锁！</div>

    <script>
        // ============================================================
        // 关键词 → 搜索结果展示名称（玩家看到的标题）
        // ============================================================
      var keywordMap = {

    // 东南亚团建报道
    '三相寺': ['《一场说走就走的旅行》——荣城天下东南亚团建报道'],
    '东南亚': ['《一场说走就走的旅行》——荣城天下东南亚团建报道'],
    '团建': ['《一场说走就走的旅行》——荣城天下东南亚团建报道'],

    // 三相寺报道
      '阿赞多': ['《三相寺住持阿赞多会见宗教事务代表团》'],

    // 财务支出审批单
    '阿赞多': ['财务支出审批单'],
    '财务': ['财务支出审批单'],

    // 公司改造方案
    '改造': ['办公环境专项改造方案'],
    '公司改造': ['办公环境专项改造方案'],
    'RCTX-GC-2011-023': ['办公环境专项改造方案'],

    // prize - 表彰通知
    '张薇': ['关于表彰年度优秀员工的通知'],
    '陈曦': ['关于表彰年度优秀员工的通知'],
    '王楠': ['关于表彰年度优秀员工的通知'],
    '李昊': ['关于表彰年度优秀员工的通知'],
    '表彰': ['关于表彰年度优秀员工的通知'],
    '优秀员工': ['关于表彰年度优秀员工的通知'],

    // 张薇博客主页
    'vivian.blog.com': ['薇薇安的日记'],
    '博客': ['薇薇安的日记'],

    // news - 火灾报道
    '火灾': ['《荣城天下总部大楼突发火灾 两人失踪》'],
    '大火': ['《荣城天下总部大楼突发火灾 两人失踪》'],
    '荣城天下火灾': ['《荣城天下总部大楼突发火灾 两人失踪》'],
    '荣城天下大火': ['《荣城天下总部大楼突发火灾 两人失踪》'],
    '失踪': ['《荣城天下总部大楼突发火灾 两人失踪》'],

    // 周荣个人资料 + 急诊就诊记录（只有这里改动了）
    '周荣': ['周荣个人资料', '三江口市第一人民医院急诊就诊记录'],

    // 胡建仁个人资料
    '胡建仁': ['胡建仁个人资料'],

    // 急诊就诊记录（单独关键词）
    '急诊': ['三江口市第一人民医院急诊就诊记录'],
    '就诊': ['三江口市第一人民医院急诊就诊记录'],
    '就诊记录': ['三江口市第一人民医院急诊就诊记录']
};

        // ============================================================
        // 展示名称 → 实际文件名（玩家看到的标题 → 点击后跳转的URL）
        // ============================================================
        var pageLinks = {
            '《一场说走就走的旅行》——荣城天下东南亚团建报道': '东南亚团建报道.html',
            '《三相寺住持阿赞多会见宗教事务代表团》': '三相寺报道.html',
            '财务支出审批单': '财务支出审批单.html',
            '办公环境专项改造方案': '公司改造方案.html',
            '关于表彰年度优秀员工的通知': 'prize.html',
            '薇薇安的日记': '张薇博客主页.html',
            '《荣城天下总部大楼突发火灾 两人失踪》': 'news.html',
            '周荣个人资料': '周荣个人资料.html',
            '胡建仁个人资料': '胡建仁个人资料.html',
            '三江口市第一人民医院急诊就诊记录': '自杀就医记录.html'
        };

        // ============================================================
        // 展示名称 → main.html 档案 ID（用于自动解锁）
        // ============================================================
        var unlockMap = {
            '《一场说走就走的旅行》——荣城天下东南亚团建报道': 'tuanjianUnlocked',
            '《三相寺住持阿赞多会见宗教事务代表团》': 'sanzhangsiUnlocked',
            '财务支出审批单': 'financeApprovalUnlocked',
            '办公环境专项改造方案': 'gongsiGaizaoUnlocked',
            '关于表彰年度优秀员工的通知': 'prizeUnlocked',
            '薇薇安的日记': 'zhangweiBlogUnlocked',
            '《荣城天下总部大楼突发火灾 两人失踪》': 'newsUnlocked',
            '周荣个人资料': 'zhourongProfileUnlocked',
            '胡建仁个人资料': 'hujianrenProfileUnlocked',
            '三江口市第一人民医院急诊就诊记录': 'zhourongMedicalUnlocked'
        };

        // ============================================================
        // 以下为功能代码
        // ============================================================

        var toastTimer = null;

        function showToast(msg) {
            var toast = document.getElementById('unlockToast');
            toast.textContent = msg || '📂 档案已解锁！';
            toast.classList.add('show');

            if (toastTimer) {
                clearTimeout(toastTimer);
            }

            toastTimer = setTimeout(function() {
                toast.classList.remove('show');
            }, 2000);
        }

        function getKeywordFromURL() {
            var params = new URLSearchParams(window.location.search);
            return params.get('keyword') || '';
        }

        function doSearch() {
            var keyword = document.getElementById('searchInput').value.trim();
            if (!keyword) return;
            window.open('search_result.html?keyword=' + encodeURIComponent(keyword), '_blank');
        }

        document.getElementById('searchInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') doSearch();
        });

        function renderResults(keyword) {
            var container = document.getElementById('resultContainer');
            if (!keyword) {
                container.innerHTML = `
                    <div class="header">
                        <span class="title">站内搜索</span>
                    </div>
                    <div class="empty-result">
                        <div class="empty-text">请输入关键词进行搜索</div>
                    </div>
                `;
                return;
            }

            var matchedPages = [];
            for (var key in keywordMap) {
                if (keyword.indexOf(key) !== -1) {
                    matchedPages = matchedPages.concat(keywordMap[key]);
                }
            }

            var uniquePages = [];
            for (var i = 0; i < matchedPages.length; i++) {
                if (uniquePages.indexOf(matchedPages[i]) === -1) {
                    uniquePages.push(matchedPages[i]);
                }
            }

            // ----- 自动解锁匹配到的档案 -----
            if (uniquePages.length > 0) {
                var newlyUnlocked = [];
                for (var j = 0; j < uniquePages.length; j++) {
                    var pageName = uniquePages[j];
                    var unlockId = unlockMap[pageName];
                    if (unlockId) {
                        try {
                            var current = localStorage.getItem(unlockId);
                            if (current !== 'true') {
                                localStorage.setItem(unlockId, 'true');
                                newlyUnlocked.push(pageName);
                            }
                        } catch (e) {}
                    }
                }
                if (newlyUnlocked.length > 0) {
                    var msg = '📂 已解锁 ' + newlyUnlocked.length + ' 份档案';
                    showToast(msg);
                }
            }

            if (uniquePages.length === 0) {
                container.innerHTML = `
                    <div class="header">
                        <span class="title">站内搜索</span>
                        <span class="keyword-display">“${keyword}”</span>
                    </div>
                    <div class="empty-result">
                        <div class="empty-text">抱歉，没有找到与“<span class="keyword-highlight">${keyword}</span>”相关的结果</div>
                        <div class="empty-hint">请尝试其他关键词</div>
                    </div>
                `;
            } else {
                var listHtml = '';
                for (var k = 0; k < uniquePages.length; k++) {
                    var pageName = uniquePages[k];
                    var link = pageLinks[pageName] || '#';
                    listHtml += `
                        <a href="${link}" target="_blank" class="result-item">${pageName}</a>
                    `;
                }

                container.innerHTML = `
                    <div class="header">
                        <span class="title">站内搜索</span>
                        <span class="keyword-display">“${keyword}”</span>
                    </div>
                    <div class="result-count">共有 <strong>${uniquePages.length}</strong> 项符合条件的结果：</div>
                    <div class="result-list">${listHtml}</div>
                `;
            }
        }

        var keyword = getKeywordFromURL();
        var input = document.getElementById('searchInput');
        if (keyword) {
            input.value = keyword;
        }
        renderResults(keyword);
    </script>

</body>
</html>
