<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工作日志</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #e6e9ef;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px;
            min-height: 100vh;
            font-family: 'Microsoft YaHei', 'PingFang SC', Arial, sans-serif;
            transition: background 0.8s ease;
        }

        body.underworld {
            background: #0a0a0a;
        }

        .global-search {
            width: 100%;
            max-width: 820px;
            display: flex;
            justify-content: flex-end;
            gap: 6px;
            margin-bottom: 16px;
        }

        .global-search input {
            width: 200px;
            padding: 6px 12px;
            font-size: 13px;
            border: 1px solid #b0a898;
            background: #ffffff;
            color: #1a1a1a;
            outline: none;
            border-radius: 2px;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.8s ease, color 0.8s ease;
            font-family: inherit;
        }

        .global-search input:focus {
            border-color: #3a6a9a;
            box-shadow: 0 0 0 2px rgba(58, 106, 154, 0.15);
        }

        .global-search input::placeholder {
            color: #9a9a8a;
            font-size: 12px;
        }

        .global-search button {
            padding: 6px 16px;
            font-size: 13px;
            border: 1px solid #b0a898;
            background: #ffffff;
            color: #1a1a1a;
            cursor: pointer;
            border-radius: 2px;
            transition: background 0.2s, border-color 0.2s, background 0.8s ease, color 0.8s ease;
            font-family: inherit;
        }

        .global-search button:hover {
            background: #f0ece4;
            border-color: #8a8a7a;
        }

        body.underworld .global-search input {
            background: #1a1a1a;
            color: #cc2222;
            border-color: #441111;
        }

        body.underworld .global-search input::placeholder {
            color: #553333;
        }

        body.underworld .global-search button {
            background: #1a1a1a;
            color: #cc2222;
            border-color: #441111;
        }

        body.underworld .global-search button:hover {
            background: #2a0a0a;
        }

        .doc-container {
            max-width: 820px;
            width: 100%;
            background: #ffffff;
            border: 1px solid #b0b8c4;
            padding: 32px 36px 28px 36px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            transition: background 0.8s ease, border-color 0.8s ease;
        }

        body.underworld .doc-container {
            background: #0f0f0f;
            border-color: #441111;
        }

        .doc-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #d0d8e0;
            padding-bottom: 10px;
            margin-bottom: 16px;
            transition: border-bottom-color 0.8s ease;
        }

        body.underworld .doc-header {
            border-bottom-color: #441111;
        }

        .doc-header .title {
            font-size: 18px;
            font-weight: bold;
            color: #1a2a3a;
            letter-spacing: 2px;
            transition: color 0.8s ease;
        }

        body.underworld .doc-header .title {
            color: #cc2222;
        }

        .doc-header .title span {
            font-weight: normal;
            font-size: 13px;
            color: #6a7a8a;
            margin-left: 10px;
            transition: color 0.8s ease;
        }

        body.underworld .doc-header .title span {
            color: #883333;
        }

        .doc-header .sys-id {
            font-size: 13px;
            color: #6a7a8a;
            transition: color 0.8s ease;
        }

        body.underworld .doc-header .sys-id {
            color: #883333;
        }

        /* 状态提示小字 */
      .status-hint {
    font-size: 12px;
    color: #8a9aaa;
    font-style: italic;
    margin-bottom: 14px;
    text-align: center;
    transition: color 0.8s ease;
    letter-spacing: 0.3px;
}

        body.underworld .status-hint {
            color: #883333;
        }

        .log-entry {
            padding: 14px 0 16px 0;
            border-bottom: 1px solid #e8ecf0;
            transition: border-bottom-color 0.8s ease;
        }

        body.underworld .log-entry {
            border-bottom-color: #2a1a1a;
        }

        .log-entry:last-child {
            border-bottom: none;
        }

        .log-entry .date {
            font-size: 13px;
            color: #6a7a8a;
            font-weight: 500;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
            transition: color 0.8s ease;
        }

        body.underworld .log-entry .date {
            color: #aa3333;
        }

        .log-entry .content {
            font-size: 15px;
            color: #1a2a3a;
            line-height: 1.8;
            padding-left: 2px;
            transition: color 0.8s ease;
        }

        body.underworld .log-entry .content {
            color: #cc2222;
        }

        .page-footer {
            margin-top: 20px;
            padding-top: 14px;
            border-top: 1px solid #e8ecf0;
            display: flex;
            justify-content: flex-end;
            transition: border-top-color 0.8s ease;
        }

        body.underworld .page-footer {
            border-top-color: #2a1a1a;
        }

        .page-footer .back-link {
            color: #3a6a9a;
            text-decoration: none;
            font-size: 13px;
            border-bottom: 1px solid transparent;
            transition: border-color 0.2s, color 0.8s ease;
        }

        body.underworld .page-footer .back-link {
            color: #883333;
        }

        .page-footer .back-link:hover {
            border-bottom-color: #3a6a9a;
        }

        @media (max-width: 640px) {
            .doc-container {
                padding: 20px 16px 18px 16px;
            }

            .doc-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 4px;
            }

            .log-entry {
                padding: 12px 0 14px 0;
            }

            .log-entry .content {
                font-size: 14px;
            }

            .global-search input {
                width: 140px;
                font-size: 12px;
                padding: 4px 10px;
            }

            .global-search button {
                font-size: 12px;
                padding: 4px 12px;
            }

            .status-hint {
                font-size: 11px;
            }
        }

        /* ===== Windows 弹窗样式 ===== */
        .window-popup {
            position: fixed;
            background: #ece9d8;
            border: 2px solid #0a1a2a;
            box-shadow: 6px 6px 20px rgba(0, 0, 0, 0.35);
            min-width: 280px;
            max-width: 360px;
            z-index: 999;
            opacity: 0;
            transform: scale(0.85);
            transition: opacity 0.25s ease, transform 0.25s ease;
            pointer-events: auto;
            user-select: none;
            font-family: 'Segoe UI', '宋体', 'Microsoft YaHei', sans-serif;
        }

        .window-popup.show {
            opacity: 1;
            transform: scale(1);
        }

        .window-popup .popup-title-bar {
            background: linear-gradient(180deg, #2a6bb0 0%, #1a4a8a 100%);
            padding: 5px 10px 5px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #ffffff;
            font-size: 12px;
            font-weight: 600;
            cursor: default;
            border-bottom: 1px solid #0a1a2a;
        }

        .window-popup .popup-title-bar .popup-title {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .window-popup .popup-title-bar .popup-title .icon {
            font-size: 14px;
        }

        .window-popup .popup-title-bar .popup-close {
            font-size: 14px;
            cursor: pointer;
            padding: 0 4px;
            line-height: 1.2;
            color: rgba(255, 255, 255, 0.7);
            transition: color 0.15s;
        }

        .window-popup .popup-title-bar .popup-close:hover {
            color: #ffffff;
        }

        .window-popup .popup-body {
            padding: 16px 20px 18px 20px;
            background: #fcf8f0;
            color: #1a1a1a;
            font-size: 14px;
            line-height: 1.6;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .window-popup .popup-body .popup-text {
            text-align: center;
        }

        .window-popup .popup-body .popup-btn {
            margin-top: 8px;
            padding: 4px 28px;
            font-size: 12px;
            border: 1px solid #b0a898;
            background: #f0ece4;
            color: #1a1a1a;
            cursor: pointer;
            border-radius: 2px;
            transition: background 0.15s;
            font-family: inherit;
        }

        .window-popup .popup-body .popup-btn:hover {
            background: #e0dcd0;
        }
    </style>
</head>
<body>

    <div class="global-search">
        <input type="text" id="searchInput" placeholder="在此处搜索" onkeydown="if(event.key==='Enter'){doSearch();}">
        <button onclick="doSearch()">搜索</button>
    </div>

    <div class="doc-container">

        <div class="doc-header">
            <div class="title">
                工作日志
                <span>胡建仁 · 总经办</span>
            </div>
            <div class="sys-id" id="queryTime">查询时间：2014-</div>
        </div>

        <!-- 状态提示小字 -->
        <div class="status-hint" id="statusHint">[ 正在查看公开日志 ]</div>

        <div id="logContent">
            <!-- 由 JavaScript 动态渲染 -->
        </div>

        <div class="page-footer">
            <a href="员工后台.html" class="back-link">← 返回后台</a>
        </div>

    </div>

    <div id="popupContainer"></div>

    <script>
        try {
    localStorage.setItem('hujianrenLogUnlocked', 'true');
} catch (e) {}
        var SECRET_KEY = '20080827';

        var surfaceLogs = [
            { date: '2011-08-03', content: '收到周荣董事长的休假申请，已按流程审批通过。' },
            { date: '2011-08-16', content: '按计划带队前往东南亚，进行为期三天的行业交流考察。' },
            { date: '2011-08-20', content: '返回公司。与阿赞多先生就公司总部办公环境优化方案进行初步沟通，对方提出了一些调整建议，已记录并安排后续评估。' },
            { date: '2011-08-21', content: '办公环境优化方案已定稿，转交财务部审核预算。' },
            { date: '2011-08-27', content: '预算已审批通过，施工方今日进场，预计工期两个月。' },
            { date: '2011-09-07', content: '施工进度正常，已完成地下室及一楼部分区域的初步改造。' },
            { date: '2011-09-20', content: '部分员工反映办公区域有异常声响，已通知后勤部门检查，暂未发现设备故障。' },
            { date: '2011-10-15', content: '年度优秀员工名单已确认，张薇、李昊、王楠、陈曦四位同事获表彰。' }
        ];

        var underworldLogs = [
            { date: '2011-08-03', content: '周荣的休假申请……他的位置空了。我签了字，但我知道他不会回来了。' },
            { date: '2011-08-16', content: '去东南亚。不是为了考察，是为了找一个人。阿赞多，三相寺。他能帮我。' },
            { date: '2011-08-20', content: '阿赞多同意了。他说：“以空间为祭，可困亡者之灵。”我问他代价，他笑了。' },
            { date: '2011-08-21', content: '方案定了。不，那不是方案，那是一张图纸。整个荣城天下是一座祭坛。' },
            { date: '2011-08-27', content: '施工队进场了。他们不知道自己在做什么，只是按图纸施工。我站在地下室，看着第一根柱子被立起来。' },
            { date: '2011-09-07', content: '他在地下室。我听到他叫我。从墙壁里，从柱子里面。他就在那里。' },
            { date: '2011-09-20', content: '员工听到了脚步声。走廊尽头，门自己开了。他们以为是设备故障。不是的。他已经在了。' },
            { date: '2011-10-15', content: '表彰名单。张薇、李昊、王楠、陈曦。他们看见了不该看见的东西。我不能让他们离开。' }
        ];

        var isUnderworld = false;
        var popupTimeout = null;
        var popupInterval = null;
        var popupCount = 0;
        var popupElements = [];
        var isPopupActive = false;

        function renderLogs() {
            var container = document.getElementById('logContent');
            var data = isUnderworld ? underworldLogs : surfaceLogs;
            var html = '';
            for (var i = 0; i < data.length; i++) {
                html += `
                    <div class="log-entry">
                        <div class="date">${data[i].date}</div>
                        <div class="content">${data[i].content}</div>
                    </div>
                `;
            }
            container.innerHTML = html;
        }

       function updateStatusHint() {
    var hint = document.getElementById('statusHint');
    if (isUnderworld) {
        hint.innerHTML = '[ <span style="text-decoration: line-through;">以下内容已被隐藏</span> ]';
    } else {
        hint.textContent = '[ 正在查看公开日志 ]';
    }
}

        function playErrorSound() {
            try {
                var audio = new Audio('提示音.mp3');
                audio.volume = 0.35;
                audio.play();
            } catch (e) {}
        }

        function createSinglePopup(index) {
            var container = document.getElementById('popupContainer');
            var popup = document.createElement('div');
            popup.className = 'window-popup';
            popup.id = 'popup-' + index;

            var popupWidth = 280 + Math.random() * 80;
            var popupHeight = 130 + Math.random() * 20;
            var maxX = window.innerWidth - popupWidth - 20;
            var maxY = window.innerHeight - popupHeight - 20;

            var finalX = 10 + Math.random() * maxX;
            var finalY = 10 + Math.random() * maxY;

            popup.style.left = finalX + 'px';
            popup.style.top = finalY + 'px';
            popup.style.width = popupWidth + 'px';
            popup.style.zIndex = 999 + index;

            popup.innerHTML = `
                <div class="popup-title-bar">
                    <span class="popup-title">
                        <span class="icon">⚠</span>
                        系统提示
                    </span>
                    <span class="popup-close">✕</span>
                </div>
                <div class="popup-body">
                    <div class="popup-text">
                        你是谁？
                        <div><button class="popup-btn">确定</button></div>
                    </div>
                </div>
            `;

            var closeBtn = popup.querySelector('.popup-close');
            closeBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                closePopup(popup);
            });

            var okBtn = popup.querySelector('.popup-btn');
            okBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                closePopup(popup);
            });

            container.appendChild(popup);

            requestAnimationFrame(function() {
                popup.classList.add('show');
            });

            popupElements.push(popup);
            return popup;
        }

        function closePopup(popup) {
            popup.classList.remove('show');
            setTimeout(function() {
                if (popup.parentNode) {
                    popup.parentNode.removeChild(popup);
                }
            }, 300);
            var idx = popupElements.indexOf(popup);
            if (idx > -1) {
                popupElements.splice(idx, 1);
            }
        }

        function dismissPopupsGradually() {
            if (popupElements.length === 0) {
                isPopupActive = false;
                return;
            }

            var toDismiss = popupElements.slice();
            var delay = 0;
            for (var i = 0; i < toDismiss.length; i++) {
                (function(el) {
                    setTimeout(function() {
                        if (el && el.parentNode) {
                            el.classList.remove('show');
                            setTimeout(function() {
                                if (el.parentNode) {
                                    el.parentNode.removeChild(el);
                                }
                            }, 300);
                        }
                    }, delay);
                })(toDismiss[i]);
                delay += 80;
            }
            setTimeout(function() {
                popupElements = [];
                isPopupActive = false;
            }, delay + 400);
        }

        function removeAllPopups() {
            for (var i = popupElements.length - 1; i >= 0; i--) {
                var el = popupElements[i];
                if (el && el.parentNode) {
                    el.classList.remove('show');
                    setTimeout(function() {
                        if (el.parentNode) {
                            el.parentNode.removeChild(el);
                        }
                    }, 300);
                }
            }
            popupElements = [];
            isPopupActive = false;
        }

        function startPopupStorm() {
            if (isPopupActive) return;
            isPopupActive = true;
            popupCount = 0;

            setTimeout(function() {
                var centerX = window.innerWidth / 2 - 160;
                var centerY = window.innerHeight / 2 - 80;
                var popup = createSinglePopup(popupCount);
                popup.style.left = centerX + 'px';
                popup.style.top = centerY + 'px';
                playErrorSound();
                popupCount++;
            }, 500);

            setTimeout(function() {
                var batchSize = 5 + Math.floor(Math.random() * 3);
                for (var i = 0; i < batchSize; i++) {
                    setTimeout(function() {
                        createSinglePopup(popupCount);
                        playErrorSound();
                        popupCount++;
                    }, i * 200);
                }
            }, 1500);

            setTimeout(function() {
                var burstDuration = 2500;
                var interval = 80;
                var total = Math.floor(burstDuration / interval);

                popupInterval = setInterval(function() {
                    createSinglePopup(popupCount);
                    playErrorSound();
                    popupCount++;
                    if (popupCount - 1 >= total + 6) {
                        clearInterval(popupInterval);
                        popupInterval = null;
                        setTimeout(function() {
                            dismissPopupsGradually();
                        }, 1500);
                    }
                }, interval);
            }, 2800);
        }

        function stopPopupStorm() {
            if (popupInterval) {
                clearInterval(popupInterval);
                popupInterval = null;
            }
            if (popupTimeout) {
                clearTimeout(popupTimeout);
                popupTimeout = null;
            }
            removeAllPopups();
            isPopupActive = false;
        }

        function setWorld(underworld) {
            isUnderworld = underworld;
            var body = document.body;

            if (isUnderworld) {
                body.classList.add('underworld');
                updateStatusHint();
                popupTimeout = setTimeout(function() {
                    startPopupStorm();
                }, 3000);
            } else {
                body.classList.remove('underworld');
                updateStatusHint();
                stopPopupStorm();
            }

            renderLogs();
        }

        function doSearch() {
            var keyword = document.getElementById('searchInput').value.trim();
            if (!keyword) return;

            if (keyword === SECRET_KEY) {
                setWorld(!isUnderworld);
                document.getElementById('searchInput').value = '';
                return;
            }

            window.location.href = 'search_result.html?keyword=' + encodeURIComponent(keyword);
        }

        function updateQueryTime() {
            var now = new Date();
            var year = 2014;
            var month = String(now.getMonth() + 1).padStart(2, '0');
            var day = String(now.getDate()).padStart(2, '0');
            var hours = String(now.getHours()).padStart(2, '0');
            var minutes = String(now.getMinutes()).padStart(2, '0');
            var seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('queryTime').textContent = '查询时间：' + year + '-' + month + '-' + day + ' ' + hours + ':' + minutes + ':' + seconds;
        }

        updateQueryTime();
        setInterval(updateQueryTime, 1000);

        window.addEventListener('beforeunload', function() {
            stopPopupStorm();
        });

        renderLogs();
        updateStatusHint();
        window.doSearch = doSearch;
    </script>

</body>
</html>
