<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>荣城天下 · 内部系统登录</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #e6e9ef;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 30px 20px;
            font-family: 'Microsoft YaHei', 'PingFang SC', Arial, sans-serif;
            position: relative;
        }

        .global-search {
            position: fixed;
            top: 20px;
            right: 24px;
            z-index: 100;
            display: flex;
            gap: 6px;
        }

        .global-search input {
            width: 180px;
            padding: 6px 12px;
            font-size: 13px;
            border: 1px solid #b0a898;
            background: #ffffff;
            color: #1a1a1a;
            outline: none;
            border-radius: 2px;
            transition: border-color 0.2s, box-shadow 0.2s;
            font-family: inherit;
        }

        .global-search input:focus {
            border-color: #3a6a9a;
            box-shadow: 0 0 0 2px rgba(58, 106, 154, 0.15);
        }

        .global-search input::placeholder {
            color: #9a9a8a;
            font-size: 12px;
        }

        .global-search button {
            padding: 6px 16px;
            font-size: 13px;
            border: 1px solid #b0a898;
            background: #ffffff;
            color: #1a1a1a;
            cursor: pointer;
            border-radius: 2px;
            transition: background 0.2s, border-color 0.2s;
            font-family: inherit;
        }

        .global-search button:hover {
            background: #f0ece4;
            border-color: #8a8a7a;
        }

        .login-container {
            max-width: 440px;
            width: 100%;
            background: #ffffff;
            border: 2px solid #1a2a3a;
            padding: 40px 36px 36px 36px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.10);
            margin-top: 40px;
        }

        .login-container .logo-area {
            text-align: center;
            margin-bottom: 28px;
        }

        .login-container .logo-area .company-name {
            font-size: 24px;
            font-weight: bold;
            color: #1a2a3a;
            letter-spacing: 6px;
            font-family: '宋体', serif;
        }

        .login-container .logo-area .company-sub {
            font-size: 12px;
            color: #6a7a8a;
            letter-spacing: 4px;
            margin-top: 4px;
        }

        .login-container .login-title {
            font-size: 16px;
            font-weight: bold;
            color: #1a2a3a;
            text-align: center;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        .login-container .form-group {
            margin-bottom: 16px;
        }

        .login-container .form-group label {
            display: block;
            font-size: 13px;
            color: #4a5a6a;
            margin-bottom: 4px;
            font-weight: 500;
        }

        .login-container .form-group input {
            width: 100%;
            padding: 10px 14px;
            font-size: 14px;
            border: 1px solid #b0b8c4;
            background: #fafbfc;
            color: #1a2a3a;
            outline: none;
            border-radius: 2px;
            transition: border-color 0.2s;
            font-family: inherit;
        }

        .login-container .form-group input:focus {
            border-color: #3a6a9a;
            background: #ffffff;
        }

        .login-container .form-group .error-msg {
            font-size: 12px;
            color: #b31b1b;
            margin-top: 4px;
            display: none;
        }

        .login-container .form-group .error-msg.show {
            display: block;
        }

        .login-container .login-btn {
            width: 100%;
            padding: 12px 0;
            font-size: 15px;
            font-weight: bold;
            background: #1a2a3a;
            color: #ffffff;
            border: none;
            border-radius: 2px;
            cursor: pointer;
            transition: background 0.2s;
            font-family: inherit;
            letter-spacing: 4px;
            margin-top: 4px;
        }

        .login-container .login-btn:hover {
            background: #2a3a4a;
        }

        .login-container .login-btn:active {
            background: #0a1a2a;
        }

        .login-container .footer-note {
            text-align: center;
            font-size: 12px;
            color: #8a9aaa;
            margin-top: 16px;
            letter-spacing: 1px;
        }

        .toast-popup {
            position: fixed;
            bottom: 40px;
            right: 40px;
            width: 380px;
            background: #f0f0f0;
            border: 1px solid #8a8a8a;
            box-shadow: 4px 4px 16px rgba(0, 0, 0, 0.25);
            border-radius: 2px;
            cursor: pointer;
            z-index: 999;
            opacity: 0;
            transform: translateY(24px);
            transition: opacity 0.4s ease, transform 0.4s ease;
            pointer-events: none;
            font-family: 'Segoe UI', 'Microsoft YaHei', Arial, sans-serif;
        }

        .toast-popup.show {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .toast-popup .toast-title-bar {
            background: linear-gradient(180deg, #d8e0ea 0%, #b8c4d4 100%);
            padding: 6px 14px 5px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #9aa8b8;
            user-select: none;
        }

        .toast-popup .toast-title-bar .left {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 600;
            color: #1a2a3a;
        }

        .toast-popup .toast-title-bar .left .win-icon {
            font-size: 16px;
            line-height: 1;
        }

        .toast-popup .toast-title-bar .close-btn {
            font-size: 14px;
            color: #4a5a6a;
            cursor: default;
            padding: 0 4px;
            line-height: 1.2;
            transition: color 0.2s;
        }

        .toast-popup .toast-title-bar .close-btn:hover {
            color: #b31b1b;
        }

        .toast-popup .toast-body {
            padding: 14px 18px 16px 18px;
            background: #ffffff;
        }

        .toast-popup .toast-body .toast-sender {
            font-size: 15px;
            font-weight: 700;
            color: #1a2a3a;
            margin-bottom: 4px;
            letter-spacing: 0.3px;
        }

        .toast-popup .toast-body .toast-preview {
            font-size: 14px;
            color: #4a5a6a;
            line-height: 1.6;
            word-break: break-word;
            padding-left: 2px;
        }

        @media (max-width: 640px) {
            .login-container {
                padding: 28px 20px 24px 20px;
                margin-top: 60px;
            }

            .login-container .logo-area .company-name {
                font-size: 20px;
                letter-spacing: 4px;
            }

            .global-search {
                top: 12px;
                right: 12px;
            }

            .global-search input {
                width: 120px;
                font-size: 12px;
                padding: 4px 8px;
            }

            .global-search button {
                font-size: 12px;
                padding: 4px 10px;
            }

            .toast-popup {
                bottom: 20px;
                right: 16px;
                left: 16px;
                width: auto;
                max-width: 380px;
            }

            .toast-popup .toast-body .toast-sender {
                font-size: 14px;
            }

            .toast-popup .toast-body .toast-preview {
                font-size: 13px;
            }
        }
    </style>
</head>
<body>

    <div class="global-search">
        <input type="text" id="searchInput" placeholder="在此处搜索" autocomplete="on" onkeydown="if(event.key==='Enter'){doSearch();}">
        <button onclick="doSearch()">搜索</button>
    </div>

    <div class="login-container">
        <div class="logo-area">
            <div class="company-name">荣城天下</div>
            <div class="company-sub">RONGCHENG TIANXIA · 内部系统登录</div>
        </div>
        <div class="login-title">员工登录</div>

        <div class="form-group">
            <label for="username">账号</label>
            <input type="text" id="username" placeholder="请输入员工账号" autocomplete="username" onkeydown="if(event.key==='Enter'){handleLogin();}">
        </div>

        <div class="form-group">
            <label for="password">密码</label>
            <input type="password" id="password" placeholder="请输入密码" autocomplete="current-password" onkeydown="if(event.key==='Enter'){handleLogin();}">
            <div class="error-msg" id="loginError">账号或密码错误，请重试</div>
        </div>

        <button class="login-btn" onclick="handleLogin()">登 录</button>

        <div class="footer-note">内部系统 · 请使用公司统一账号登录</div>
    </div>

    <div class="toast-popup" id="toastPopup" onclick="handleToastClick()">
        <div class="toast-title-bar">
            <div class="left">
                <span class="win-icon">💬</span>
                <span>新消息</span>
            </div>
            <span class="close-btn" onclick="event.stopPropagation(); closeToast();">✕</span>
        </div>
        <div class="toast-body">
            <div class="toast-sender">匿名用户</div>
            <div class="toast-preview">对了，还有一个东西或许你用得上。</div>
        </div>
    </div>

    <script>
        // ----- 登录状态检查 -----
        function checkLoginStatus() {
            try {
                var isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
                if (isLoggedIn) {
                    window.location.href = '员工后台.html';
                }
            } catch (e) {}
        }

        // ----- 登录逻辑 -----
        function handleLogin() {
            var username = document.getElementById('username').value.trim();
            var password = document.getElementById('password').value.trim();
            var errorMsg = document.getElementById('loginError');

            if (username === 'hujianren-zjb' && password === '20050701') {
                errorMsg.classList.remove('show');
                try {
                    localStorage.setItem('isLoggedIn', 'true');
                } catch (e) {}
                window.location.href = '员工后台.html';
            } else {
                errorMsg.classList.add('show');
                document.getElementById('password').value = '';
                document.getElementById('password').focus();
            }
        }

        // ----- 弹窗逻辑 -----
        var toastShown = false;
        var toastTimer = null;

        function showToast() {
            if (toastShown) return;
            var toast = document.getElementById('toastPopup');
            toast.classList.add('show');
            toastShown = true;
        }

        function closeToast() {
            var toast = document.getElementById('toastPopup');
            toast.classList.remove('show');
        }

        function handleToastClick() {
            window.open('index.html?new=account', '_blank');
        }

        // ----- 页面加载 -----
        window.addEventListener('load', function() {
            checkLoginStatus();
            toastTimer = setTimeout(showToast, 3000);
        });

        // ----- 搜索框 -----
        function doSearch() {
            var keyword = document.getElementById('searchInput').value.trim();
            if (!keyword) return;
            window.location.href = 'search_result.html?keyword=' + encodeURIComponent(keyword);
        }

        window.handleLogin = handleLogin;
        window.handleToastClick = handleToastClick;
        window.doSearch = doSearch;
        window.closeToast = closeToast;
    </script>

</body>
</html>
