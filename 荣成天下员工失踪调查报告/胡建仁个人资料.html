<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>胡建仁 · 高管档案 · 荣城天下</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #e6e9ef;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px;
            min-height: 100vh;
            font-family: 'Microsoft YaHei', 'PingFang SC', Arial, sans-serif;
        }

        .global-search {
            width: 100%;
            max-width: 820px;
            display: flex;
            justify-content: flex-end;
            gap: 6px;
            margin-bottom: 16px;
        }

        .global-search input {
            width: 200px;
            padding: 6px 12px;
            font-size: 13px;
            border: 1px solid #b0a898;
            background: #ffffff;
            color: #1a1a1a;
            outline: none;
            border-radius: 2px;
            transition: border-color 0.2s, box-shadow 0.2s;
            font-family: inherit;
        }

        .global-search input:focus {
            border-color: #3a6a9a;
            box-shadow: 0 0 0 2px rgba(58, 106, 154, 0.15);
        }

        .global-search input::placeholder {
            color: #9a9a8a;
            font-size: 12px;
        }

        .global-search button {
            padding: 6px 16px;
            font-size: 13px;
            border: 1px solid #b0a898;
            background: #ffffff;
            color: #1a1a1a;
            cursor: pointer;
            border-radius: 2px;
            transition: background 0.2s, border-color 0.2s;
            font-family: inherit;
        }

        .global-search button:hover {
            background: #f0ece4;
            border-color: #8a8a7a;
        }

        .profile-container {
            max-width: 820px;
            width: 100%;
            background: #ffffff;
            border: 2px solid #1a2a3a;
            padding: 28px 32px 24px 32px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.10);
        }

        .profile-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #1a2a3a;
            padding-bottom: 10px;
            margin-bottom: 18px;
        }

        .profile-header .title {
            font-size: 18px;
            font-weight: bold;
            color: #1a2a3a;
            letter-spacing: 3px;
        }

        .profile-header .title span {
            font-weight: normal;
            font-size: 13px;
            color: #6a7a8a;
            margin-left: 12px;
            letter-spacing: 1px;
        }

        .profile-header .sys-id {
            font-size: 13px;
            color: #6a7a8a;
        }

        .profile-body {
            display: flex;
            gap: 28px;
            flex-wrap: wrap;
        }

        .avatar-col {
            flex-shrink: 0;
            text-align: center;
        }

        /* 照片缩小到 110x136 */
        .avatar-col .avatar-box {
            width: 110px;
            height: 136px;
            background: #d0d8e0;
            border: 2px solid #1a2a3a;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .avatar-col .avatar-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .avatar-col .avatar-label {
            font-size: 12px;
            color: #8a9aaa;
            margin-top: 4px;
            letter-spacing: 1px;
        }

        .info-col {
            flex: 1;
            min-width: 260px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px 20px;
            align-content: start;
        }

        .info-col .item {
            display: flex;
            gap: 4px;
            font-size: 14px;
            color: #1a2a3a;
            padding: 5px 0;
            border-bottom: 1px solid #f0f2f4;
        }

        .info-col .item .label {
            color: #6a7a8a;
            min-width: 72px;
            flex-shrink: 0;
        }

        .info-col .item .value {
            color: #1a2a3a;
            font-weight: 500;
            word-break: break-word;
        }

        .remark-section {
            margin-top: 18px;
            padding-top: 14px;
            border-top: 2px solid #d0d8e0;
        }

        .remark-section .remark-label {
            font-size: 13px;
            color: #6a7a8a;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .remark-section .remark-text {
            font-size: 14px;
            color: #1a2a3a;
            line-height: 1.9;
        }

        .remark-section .remark-text .line {
            display: block;
            padding: 2px 0;
            padding-left: 4px;
        }

        .remark-section .remark-text .line .num {
            display: inline-block;
            width: 22px;
            text-align: right;
            margin-right: 8px;
            color: #6a7a8a;
            font-weight: 500;
        }

        .profile-footer {
            margin-top: 18px;
            padding-top: 14px;
            border-top: 1px solid #e8ecf0;
            display: flex;
            justify-content: flex-end;
        }

        .profile-footer .back-link {
            color: #3a6a9a;
            text-decoration: none;
            font-size: 13px;
            border-bottom: 1px solid transparent;
            transition: border-color 0.2s;
        }

        .profile-footer .back-link:hover {
            border-bottom-color: #3a6a9a;
        }

        @media (max-width: 640px) {
            .profile-container {
                padding: 18px 14px 20px 14px;
            }

            .profile-body {
                flex-direction: column;
                align-items: center;
            }

            .avatar-col .avatar-box {
                width: 100px;
                height: 124px;
            }

            .info-col {
                grid-template-columns: 1fr;
                width: 100%;
            }

            .global-search input {
                width: 140px;
                font-size: 12px;
                padding: 4px 10px;
            }

            .global-search button {
                font-size: 12px;
                padding: 4px 12px;
            }
        }
    </style>
</head>
<body>

    <div class="global-search">
        <input type="text" id="searchInput" placeholder="在此处搜索" onkeydown="if(event.key==='Enter'){doSearch();}">
        <button onclick="doSearch()">搜索</button>
    </div>

    <div class="profile-container">

        <div class="profile-header">
            <div class="title">
                高管档案
                <span>荣城天下 · 人事系统</span>
            </div>
            <div class="sys-id" id="queryTime">查询时间：2014-</div>
        </div>

        <div class="profile-body">

            <div class="avatar-col">
                <div class="avatar-box">
                    <img src="胡建仁证件照.jpg" alt="胡建仁证件照">
                </div>
                <div class="avatar-label">胡建仁 · 总经办</div>
            </div>

            <div class="info-col">
                <div class="item"><span class="label">姓名</span><span class="value">胡建仁</span></div>
                <div class="item"><span class="label">性别</span><span class="value">男</span></div>
                <div class="item"><span class="label">出生日期</span><span class="value">1982-02-21（29岁）</span></div>
                <div class="item"><span class="label">部门</span><span class="value">总经办</span></div>
                <div class="item"><span class="label">职位</span><span class="value">董事会秘书</span></div>
                <div class="item"><span class="label">工号</span><span class="value">RCTX-0003</span></div>
                <div class="item"><span class="label">入职日期</span><span class="value">2005-07-01</span></div>
                <div class="item"><span class="label">政治面貌</span><span class="value">群众</span></div>
                <div class="item"><span class="label">直接上级</span><span class="value">周荣（董事长）</span></div>
                <div class="item"><span class="label">联系电话</span><span class="value">136-xxxx-xxxx</span></div>
                <div class="item"><span class="label">紧急联系人</span><span class="value">周荣 139-xxxx-xxxx</span></div>
            </div>

        </div>

        <div class="remark-section">
            <div class="remark-label">备注</div>
            <div class="remark-text">
                <span class="line"><span class="num">1.</span>2005年7月入职，担任董事长助理，后升任董事会秘书。</span>
                <span class="line"><span class="num">2.</span>长期负责公司重要文件的起草与审核，以及对外联络事务。</span>
                <span class="line"><span class="num">3.</span>与董事长周荣关系密切，多次共同出席重要商务活动。</span>
                <span class="line"><span class="num">4.</span>2011年8月周荣出国休养后，代理主持公司日常事务。</span>
            </div>
        </div>

        <div class="profile-footer">
            <a href="main.html" class="back-link">← 返回档案目录</a>
        </div>

    </div>

    <script>
        try {
    localStorage.setItem('hujianrenProfileUnlocked', 'true');
} catch (e) {}
        function updateQueryTime() {
            var now = new Date();
            var year = 2014;
            var month = String(now.getMonth() + 1).padStart(2, '0');
            var day = String(now.getDate()).padStart(2, '0');
            var hours = String(now.getHours()).padStart(2, '0');
            var minutes = String(now.getMinutes()).padStart(2, '0');
            var seconds = String(now.getSeconds()).padStart(2, '0');
            var timeStr = year + '-' + month + '-' + day + ' ' + hours + ':' + minutes + ':' + seconds;
            document.getElementById('queryTime').textContent = '查询时间：' + timeStr;
        }

        updateQueryTime();
        setInterval(updateQueryTime, 1000);

        function doSearch() {
            var keyword = document.getElementById('searchInput').value.trim();
            if (!keyword) return;
            window.location.href = 'search_result.html?keyword=' + encodeURIComponent(keyword);
        }
    </script>

</body>
</html>
