<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>身份验证 · 医保系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #e6e9ef;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px;
            min-height: 100vh;
            font-family: 'Microsoft YaHei', 'PingFang SC', Arial, sans-serif;
        }

        .global-search {
            width: 100%;
            max-width: 920px;
            display: flex;
            justify-content: flex-end;
            gap: 6px;
            margin-bottom: 16px;
        }

        .global-search input {
            width: 200px;
            padding: 6px 12px;
            font-size: 13px;
            border: 1px solid #b0a898;
            background: #ffffff;
            color: #1a1a1a;
            outline: none;
            border-radius: 2px;
            transition: border-color 0.2s, box-shadow 0.2s;
            font-family: inherit;
        }

        .global-search input:focus {
            border-color: #3a6a9a;
            box-shadow: 0 0 0 2px rgba(58, 106, 154, 0.15);
        }

        .global-search input::placeholder {
            color: #9a9a8a;
            font-size: 12px;
        }

        .global-search button {
            padding: 6px 16px;
            font-size: 13px;
            border: 1px solid #b0a898;
            background: #ffffff;
            color: #1a1a1a;
            cursor: pointer;
            border-radius: 2px;
            transition: background 0.2s, border-color 0.2s;
            font-family: inherit;
        }

        .global-search button:hover {
            background: #f0ece4;
            border-color: #8a8a7a;
        }

        .page-container {
            max-width: 920px;
            width: 100%;
            background: #ffffff;
            border: 1px solid #b0b8c4;
            padding: 28px 32px 24px 32px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #d0d8e0;
            padding-bottom: 10px;
            margin-bottom: 18px;
        }

        .page-header .title {
            font-size: 18px;
            font-weight: bold;
            color: #1a2a3a;
            letter-spacing: 2px;
        }

        .page-header .title span {
            font-weight: normal;
            font-size: 13px;
            color: #6a7a8a;
            margin-left: 10px;
        }

        .page-header .sys-id {
            font-size: 13px;
            color: #6a7a8a;
        }

        .verify-area {
            text-align: center;
            padding: 30px 20px;
        }

        .hint-card {
            background: #f7f8fa;
            border: 1px solid #d0d8e0;
            padding: 18px 24px 20px 24px;
            margin-bottom: 24px;
            display: inline-block;
            text-align: left;
            font-family: 'Courier New', monospace;
            border-radius: 4px;
            min-width: 260px;
        }

        .hint-card .hint-line {
            font-size: 16px;
            color: #1a2a3a;
            line-height: 2.2;
            letter-spacing: 1px;
            font-family: 'Courier New', monospace;
        }

        .hint-card .hint-divider {
            border: none;
            border-top: 1px dashed #d0d8e0;
            margin: 4px 0 6px 0;
        }

        .hint-card .hint-question {
            font-size: 20px;
            font-weight: bold;
            color: #1a2a3a;
            font-family: 'Courier New', monospace;
            letter-spacing: 0;
        }

        .fill-area {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            font-family: 'Courier New', monospace;
            margin-top: 4px;
        }

        .fill-area .fill-input {
            width: 40px;
            height: 44px;
            padding: 4px;
            font-size: 20px;
            font-weight: bold;
            border: none;
            border-bottom: 2px solid #1a2a3a;
            background: transparent;
            color: #1a2a3a;
            outline: none;
            text-align: center;
            font-family: 'Courier New', monospace;
            letter-spacing: 2px;
            transition: border-color 0.2s;
        }

        .fill-area .fill-input:focus {
            border-bottom-color: #3a6a9a;
        }

        .fill-area .fill-input.error {
            border-bottom-color: #b31b1b;
        }

        .fill-area .fill-suffix {
            font-size: 20px;
            font-weight: bold;
            color: #1a2a3a;
            font-family: 'Courier New', monospace;
        }

        .fill-area .fill-btn {
            padding: 8px 24px;
            font-size: 14px;
            border: 1px solid #b0b8c4;
            background: #ffffff;
            color: #1a2a3a;
            cursor: pointer;
            border-radius: 2px;
            transition: background 0.2s, border-color 0.2s;
            font-family: 'Microsoft YaHei', sans-serif;
            margin-left: 10px;
        }

        .fill-area .fill-btn:hover {
            background: #e8ecf0;
            border-color: #8a9aaa;
        }

        .error-msg {
            font-size: 13px;
            color: #b31b1b;
            margin-top: 14px;
            display: none;
            font-family: 'Microsoft YaHei', sans-serif;
        }

        .error-msg.show {
            display: block;
        }

        .page-footer {
            margin-top: 18px;
            padding-top: 14px;
            border-top: 1px solid #e8ecf0;
            display: flex;
            justify-content: flex-end;
        }

        .page-footer .back-link {
            color: #3a6a9a;
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: border-color 0.2s;
        }

        .page-footer .back-link:hover {
            border-bottom-color: #3a6a9a;
        }

        @media (max-width: 640px) {
            .page-container {
                padding: 18px 14px 20px 14px;
            }

            .fill-area {
                gap: 4px;
            }

            .fill-area .fill-input {
                width: 32px;
                height: 38px;
                font-size: 16px;
                border-bottom-width: 2px;
            }

            .fill-area .fill-suffix {
                font-size: 16px;
            }

            .hint-card {
                min-width: auto;
                padding: 14px 16px 16px 16px;
            }

            .hint-card .hint-line {
                font-size: 14px;
            }

            .hint-card .hint-question {
                font-size: 17px;
            }

            .global-search input {
                width: 140px;
                font-size: 12px;
                padding: 4px 10px;
            }

            .global-search button {
                font-size: 12px;
                padding: 4px 12px;
            }
        }
    </style>
</head>
<body>

    <div class="global-search">
        <input type="text" id="searchInput" placeholder="在此处搜索" onkeydown="if(event.key==='Enter'){doSearch();}">
        <button onclick="doSearch()">搜索</button>
    </div>

    <div class="page-container">

        <div class="page-header">
            <div class="title">
                身份验证
                <span>荣城天下 · 医保系统</span>
            </div>
            <div class="sys-id" id="queryTime">查询时间：2014-</div>
        </div>

        <div class="verify-area">

            <div class="hint-card">
                <div class="hint-line">
                    B = D &nbsp;&nbsp; D = F &nbsp;&nbsp; O = Q
                </div>
                <div class="hint-line">
                    H = J &nbsp;&nbsp; N = P &nbsp;&nbsp; W = Y
                </div>
                <hr class="hint-divider">
                <div class="hint-question">
                    T E V Z = ?
                </div>
            </div>

            <div class="fill-area">
                <input type="text" class="fill-input" id="c1" maxlength="1" autocomplete="on" onkeyup="moveNext(this, 'c2')" onfocus="this.select()">
                <input type="text" class="fill-input" id="c2" maxlength="1" autocomplete="on" onkeyup="moveNext(this, 'c3')" onfocus="this.select()">
                <input type="text" class="fill-input" id="c3" maxlength="1" autocomplete="on" onkeyup="moveNext(this, 'c4')" onfocus="this.select()">
                <input type="text" class="fill-input" id="c4" maxlength="1" autocomplete="on" onkeyup="moveNext(this, null)" onfocus="this.select()">

                <span class="fill-suffix">-0042</span>

                <button class="fill-btn" onclick="verify()">验证</button>
            </div>

            <div class="error-msg" id="errorMsg">密码错误，请重试</div>
        </div>

        <div class="page-footer">
            <a href="医保记录.html" class="back-link">← 返回医保记录</a>
        </div>

    </div>

    <script>
        var CORRECT_ANSWER = 'RCTX';

        function moveNext(current, nextId) {
            var val = current.value.toUpperCase();
            var regex = /^[A-Z]$/;
            if (val && !regex.test(val)) {
                current.value = '';
                return;
            }
            if (val && nextId) {
                var next = document.getElementById(nextId);
                if (next) {
                    next.focus();
                }
            }
        }

        function verify() {
            var inputs = ['c1', 'c2', 'c3', 'c4'];
            var userInput = '';
            var errorMsg = document.getElementById('errorMsg');
            var hasError = false;

            for (var i = 0; i < inputs.length; i++) {
                var el = document.getElementById(inputs[i]);
                var val = el.value.trim().toUpperCase();
                if (val === '') {
                    el.classList.add('error');
                    hasError = true;
                } else {
                    el.classList.remove('error');
                    userInput += val;
                }
            }

            if (userInput.length === 4 && userInput === CORRECT_ANSWER) {
                window.open('张薇就诊记录.html', '_blank');
                return;
            }

            for (var j = 0; j < inputs.length; j++) {
                var el = document.getElementById(inputs[j]);
                el.classList.add('error');
                setTimeout(function() {
                    el.classList.remove('error');
                }, 800);
            }
            errorMsg.classList.add('show');
            for (var k = 0; k < inputs.length; k++) {
                document.getElementById(inputs[k]).value = '';
            }
            document.getElementById('c1').focus();

            setTimeout(function() {
                errorMsg.classList.remove('show');
            }, 2000);
        }

        function updateQueryTime() {
            var now = new Date();
            var year = 2014;
            var month = String(now.getMonth() + 1).padStart(2, '0');
            var day = String(now.getDate()).padStart(2, '0');
            var hours = String(now.getHours()).padStart(2, '0');
            var minutes = String(now.getMinutes()).padStart(2, '0');
            var seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('queryTime').textContent = '查询时间：' + year + '-' + month + '-' + day + ' ' + hours + ':' + minutes + ':' + seconds;
        }

        updateQueryTime();
        setInterval(updateQueryTime, 1000);

        function doSearch() {
            var keyword = document.getElementById('searchInput').value.trim();
            if (!keyword) return;
            window.location.href = 'search_result.html?keyword=' + encodeURIComponent(keyword);
        }

        window.moveNext = moveNext;
        window.verify = verify;
        window.doSearch = doSearch;
    </script>

</body>
</html>
