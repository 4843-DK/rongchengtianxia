<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>档案目录</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #e6e9ef;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px;
            min-height: 100vh;
            font-family: 'Segoe UI', 'Microsoft YaHei', '宋体', sans-serif;
        }

        .global-search {
            width: 100%;
            max-width: 780px;
            display: flex;
            justify-content: flex-end;
            gap: 6px;
            margin-bottom: 20px;
        }

        .global-search input {
            width: 200px;
            padding: 6px 12px;
            font-size: 13px;
            border: 1px solid #b0a898;
            background: #ffffff;
            color: #1a1a1a;
            outline: none;
            border-radius: 2px;
            transition: border-color 0.2s, box-shadow 0.2s;
            font-family: inherit;
        }

        .global-search input:focus {
            border-color: #3a6a9a;
            box-shadow: 0 0 0 2px rgba(58, 106, 154, 0.15);
        }

        .global-search input::placeholder {
            color: #9a9a8a;
            font-size: 12px;
        }

        .global-search button {
            padding: 6px 16px;
            font-size: 13px;
            border: 1px solid #b0a898;
            background: #ffffff;
            color: #1a1a1a;
            cursor: pointer;
            border-radius: 2px;
            transition: background 0.2s, border-color 0.2s;
            font-family: inherit;
        }

        .global-search button:hover {
            background: #f0ece4;
            border-color: #8a8a7a;
        }

        .folder-container {
            max-width: 780px;
            width: 100%;
            background: #ffffff;
            border: 2px solid #1a2a3a;
            padding: 28px 32px 24px 32px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.10);
        }

        .folder-header {
            border-bottom: 3px solid #1a2a3a;
            padding-bottom: 10px;
            margin-bottom: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .folder-header .title {
            font-size: 20px;
            font-weight: bold;
            color: #1a2a3a;
            letter-spacing: 4px;
        }

        .folder-header .stats {
            font-size: 13px;
            color: #6a7a8a;
        }

        .folder-header .stats .num {
            color: #1a2a3a;
        }

        .section-toggle {
            font-size: 14px;
            font-weight: bold;
            color: #1a2a3a;
            cursor: pointer;
            padding: 6px 0 4px 0;
            margin-top: 14px;
            border-bottom: 1px solid #e8ecf0;
            display: flex;
            align-items: center;
            gap: 6px;
            user-select: none;
            transition: color 0.15s;
        }

        .section-toggle:hover {
            color: #1a6bb0;
        }

        .section-toggle .arrow {
            font-size: 12px;
            display: inline-block;
            transition: transform 0.25s ease;
            color: #6a7a8a;
        }

        .section-toggle .arrow.open {
            transform: rotate(90deg);
        }

        .section-toggle:first-of-type {
            margin-top: 0;
        }

        .file-list {
            display: none;
            flex-direction: column;
            gap: 2px;
            padding-left: 24px;
            padding-top: 4px;
            padding-bottom: 4px;
        }

        .file-list.open {
            display: flex;
        }

        .file-item {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 3px 8px;
            font-size: 14px;
            min-height: 26px;
            border-radius: 2px;
            transition: background 0.12s;
        }

        .file-item:hover {
            background: #f7f8fa;
        }

        .file-item.unlocked .file-name {
            color: #1a1a1a;
            text-decoration: none;
            cursor: pointer;
            transition: color 0.15s, text-decoration 0.15s;
        }

        .file-item.unlocked .file-name:hover {
            color: #1a6bb0;
            text-decoration: underline;
        }

        .file-item.locked .file-name {
            color: #8a9aaa;
            cursor: default;
        }

        .file-item .file-name .bracket {
            color: #8a9aaa;
        }

        .page-footer {
            margin-top: 20px;
            padding-top: 14px;
            border-top: 1px solid #e8ecf0;
            display: flex;
            justify-content: flex-end;
        }

        .page-footer .back-link {
            color: #3a6a9a;
            text-decoration: none;
            font-size: 13px;
            border-bottom: 1px solid transparent;
            transition: border-color 0.2s;
        }

        .page-footer .back-link:hover {
            border-bottom-color: #3a6a9a;
        }

        @media (max-width: 640px) {
            .folder-container {
                padding: 18px 14px 20px 14px;
            }

            .folder-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 4px;
            }

            .file-item {
                font-size: 13px;
                padding: 3px 4px;
            }

            .global-search input {
                width: 140px;
                font-size: 12px;
                padding: 4px 10px;
            }

            .global-search button {
                font-size: 12px;
                padding: 4px 12px;
            }
        }
    </style>
</head>
<body>

    <div class="global-search">
        <input type="text" id="searchInput" placeholder="在此处搜索" onkeydown="if(event.key==='Enter'){doSearch();}">
        <button onclick="doSearch()">搜索</button>
    </div>

    <div class="folder-container">

        <div class="folder-header">
            <div class="title">📁 档案目录</div>
            <div class="stats" id="statsDisplay">
                已解锁：<span class="num" id="unlockedCount">0</span> / <span id="totalCount">0</span>
            </div>
        </div>

        <div id="fileListContainer"></div>

        <div class="page-footer">
            <a href="index.html" class="back-link">← 返回首页</a>
        </div>

    </div>

    <script>
        var fileList = [
            { id: 'newsUnlocked', name: '三江晚报《荣城天下总部大楼突发火灾 两人失踪》', category: '公开资料' },
            { id: 'gongsizhuyeUnlocked', name: '荣城天下公司主页', category: '公开资料' },
            { id: 'hujianrenDesktopUnlocked', name: '胡建仁电脑桌面', category: '公开资料' },

            { id: 'tuanjianUnlocked', name: '《一场说走就走的旅行》——荣城天下东南亚团建报道', category: '往来文件' },
            { id: 'sanzhangsiUnlocked', name: '《三相寺住持阿赞多会见宗教事务代表团》', category: '往来文件' },
            { id: 'financeListUnlocked', name: '财务支出列表', category: '往来文件' },
            { id: 'financeApprovalUnlocked', name: '财务支出审批单', category: '往来文件' },

            { id: 'gongsiGaizaoUnlocked', name: '办公环境专项改造方案', category: '工程记录' },
            { id: 'xianchangKanceUnlocked', name: '现场勘测记录（节选）', category: '工程记录' },
            { id: 'houqinWeixiuUnlocked', name: '后勤维修记录', category: '工程记录' },
            { id: 'hujianrenLogUnlocked', name: '工作日志', category: '工程记录' },

            { id: 'zhourongProfileUnlocked', name: '周荣个人资料', category: '人事档案' },
            { id: 'hujianrenProfileUnlocked', name: '胡建仁个人资料', category: '人事档案' },
            { id: 'yuangongMingluUnlocked', name: '员工名录', category: '人事档案' },
            { id: 'queqinDengjiUnlocked', name: '缺勤登记表', category: '人事档案' },
            { id: 'prizeUnlocked', name: '关于表彰年度优秀员工的通知', category: '人事档案' },
            { id: 'yibaoJiluUnlocked', name: '医保记录', category: '人事档案' },
            { id: 'zhangweiProfileUnlocked', name: '张薇个人资料', category: '人事档案' },
            { id: 'lihaoProfileUnlocked', name: '李昊个人资料', category: '人事档案' },
            { id: 'wangnanProfileUnlocked', name: '王楠个人资料', category: '人事档案' },
            { id: 'chenxiProfileUnlocked', name: '陈曦个人资料', category: '人事档案' },
            { id: 'zhangweiBlogUnlocked', name: '薇薇安的日记', category: '人事档案' },
            { id: 'zhangweiTreatmentUnlocked', name: '员工就诊记录', category: '人事档案' },
            { id: 'zhourongMedicalUnlocked', name: '三江口市第一人民医院急诊就诊记录', category: '人事档案' },
            { id: 'baogaodanUnlocked', name: '三江口市第一人民医院精神心理科结果分析报告单', category: '人事档案' }
        ];

        var categoryOrder = ['公开资料', '往来文件', '工程记录', '人事档案'];
        var categoryState = {};

        var INITIAL_UNLOCKED = [
            'newsUnlocked',
            'gongsizhuyeUnlocked',
                   ];

        function isUnlocked(id) {
            try {
                return localStorage.getItem(id) === 'true';
            } catch (e) {
                return false;
            }
        }

        function initializeUnlocked() {
            for (var i = 0; i < INITIAL_UNLOCKED.length; i++) {
                var id = INITIAL_UNLOCKED[i];
                try {
                    if (!localStorage.getItem(id)) {
                        localStorage.setItem(id, 'true');
                    }
                } catch (e) {}
            }
        }

        function getFileLink(id) {
            var map = {
                'newsUnlocked': 'news.html',
                'gongsizhuyeUnlocked': '公司主页.html',
                'hujianrenDesktopUnlocked': '胡建仁电脑桌面.html',
                'tuanjianUnlocked': '东南亚团建报道.html',
                'sanzhangsiUnlocked': '三相寺报道.html',
                'financeListUnlocked': '财务支出列表.html',
                'financeApprovalUnlocked': '财务支出审批单.html',
                'gongsiGaizaoUnlocked': '公司改造方案.html',
                'xianchangKanceUnlocked': '现场勘测记录.html',
                'houqinWeixiuUnlocked': '后勤维修记录.html',
                'hujianrenLogUnlocked': '胡建仁工作日志.html',
                'zhourongProfileUnlocked': '周荣个人资料.html',
                'hujianrenProfileUnlocked': '胡建仁个人资料.html',
                'yuangongMingluUnlocked': '员工名录.html',
                'queqinDengjiUnlocked': '缺勤登记表.html',
                'prizeUnlocked': 'prize.html',
                'yibaoJiluUnlocked': '医保记录.html',
                'yibaoYanzhengUnlocked': '医保验证.html',
                'zhangweiProfileUnlocked': '张薇个人资料.html',
                'lihaoProfileUnlocked': '李昊个人资料.html',
                'wangnanProfileUnlocked': '王楠个人资料.html',
                'chenxiProfileUnlocked': '陈曦个人资料.html',
                'zhangweiBlogUnlocked': '张薇博客主页.html',
                'zhangweiTreatmentUnlocked': '张薇就诊记录.html',
                'zhourongMedicalUnlocked': '自杀就医记录.html',
                'baogaodanUnlocked': '躁郁症确诊报告.html'
            };
            return map[id] || '#';
        }

        function toggleCategory(catName) {
            var key = 'cat_' + catName;
            categoryState[key] = !categoryState[key];
            renderFileList();
        }

        function renderFileList() {
            var container = document.getElementById('fileListContainer');
            var unlockedCount = 0;
            var totalCount = fileList.length;

            var categories = {};
            for (var i = 0; i < fileList.length; i++) {
                var file = fileList[i];
                var cat = file.category || '其他';
                if (!categories[cat]) {
                    categories[cat] = [];
                }
                categories[cat].push(file);
            }

            var html = '';

            for (var ci = 0; ci < categoryOrder.length; ci++) {
                var catName = categoryOrder[ci];
                var files = categories[catName] || [];
                var key = 'cat_' + catName;
                var isOpen = categoryState[key] || false;

                var catUnlocked = 0;
                for (var fi = 0; fi < files.length; fi++) {
                    if (isUnlocked(files[fi].id)) catUnlocked++;
                }

                html += '<div class="section-toggle" onclick="toggleCategory(\'' + catName + '\')">';
                html += '<span class="arrow' + (isOpen ? ' open' : '') + '">▶</span>';
                html += catName;
                html += ' <span style="font-weight:normal;font-size:12px;color:#8a9aaa;">(' + catUnlocked + '/' + files.length + ')</span>';
                html += '</div>';

                html += '<div class="file-list' + (isOpen ? ' open' : '') + '">';
                for (var fj = 0; fj < files.length; fj++) {
                    var file = files[fj];
                    var unlocked = isUnlocked(file.id);
                    if (unlocked) unlockedCount++;

                    var link = getFileLink(file.id);

                    html += '<div class="file-item ' + (unlocked ? 'unlocked' : 'locked') + '">';
                    if (unlocked) {
                        html += '<span class="file-name" onclick="window.open(\'' + link + '\', \'_blank\')">' + file.name + '</span>';
                    } else {
                        html += '<span class="file-name"><span class="bracket">[</span> 该档案未解锁 <span class="bracket">]</span></span>';
                    }
                    html += '</div>';
                }
                html += '</div>';
            }

            container.innerHTML = html;

            document.getElementById('unlockedCount').textContent = unlockedCount;
            document.getElementById('totalCount').textContent = totalCount;
        }

        function refreshIfVisible() {
            if (!document.hidden) {
                renderFileList();
            }
        }

        document.addEventListener('visibilitychange', refreshIfVisible);
        window.addEventListener('focus', function() {
            renderFileList();
        });

        function doSearch() {
            var keyword = document.getElementById('searchInput').value.trim();
            if (!keyword) return;
            window.location.href = 'search_result.html?keyword=' + encodeURIComponent(keyword);
        }

        initializeUnlocked();
        renderFileList();

        window.toggleCategory = toggleCategory;
        window.doSearch = doSearch;
    </script>

</body>
</html>
